<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Legion | Angelic Sovereign NFTs</title>
    <style>
        /* Premium Immersive Theme Initialization */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #0a1122 0%, #03060c 100%);
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Cosmic Particle Effect Background */
        .cosmic-void {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                radial-gradient(rgba(212, 175, 55, 0.1) 2px, transparent 2px);
            background-size: 40px 40px, 120px 120px;
            opacity: 0.4;
            z-index: -1;
            animation: driftParticles 20s linear infinite;
        }

        /* Hero Divine Portal Presentation */
        header {
            text-align: center;
            padding: 90px 20px 30px 20px;
            position: relative;
        }

        .divine-halo {
            width: 140px;
            height: 25px;
            background: transparent;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            box-shadow: 0 0 35px 8px rgba(212, 175, 55, 0.7);
            border: 2px solid rgba(255, 223, 128, 0.5);
            animation: hoverLevitation 5s ease-in-out infinite;
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 
                0 0 15px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(135, 206, 250, 0.5),
                0 0 45px rgba(212, 175, 55, 0.3);
        }

        .subtitle {
            font-size: 1.15rem;
            color: #94a3b8;
            letter-spacing: 3px;
            margin-top: 15px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Main Translucent Glass Dashboard Container */
        main {
            max-width: 650px;
            margin: 30px auto 80px auto;
            padding: 35px;
            background: rgba(10, 17, 34, 0.45);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        h2 {
            font-size: 1.7rem;
            color: #d4af37;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .meta-tag {
            font-size: 0.8rem;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            display: inline-block;
            background: rgba(56, 189, 248, 0.08);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.15);
        }

        /* Sovereign Digital Image Showcase Frame */
        .canvas-frame {
            width: 100%;
            height: 380px;
            background: #020408;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: cubic-bezier(0.16, 1, 0.3, 1) 0px 4px 30px;
        }

        .canvas-frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, transparent 60%, rgba(3, 6, 12, 0.8) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .angel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .canvas-frame:hover .angel-image {
            transform: scale(1.04);
        }

        /* High-End Polished Sovereign Network Button */
        .sovereign-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #e5c158 0%, #b89223 100%);
            border: none;
            border-radius: 12px;
            color: #03060c;
            font-weight: 700;
            font-size: 1.15rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sovereign-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.55);
            background: linear-gradient(135deg, #ffe28a 0%, #e5c158 100%);
        }

        .sovereign-btn:active {
            transform: translateY(-1px);
        }

        /* Decorative Fluid Core Animations */
        @keyframes hoverLevitation {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-10px) scale(1.04); opacity: 1; }
        }

        @keyframes driftParticles {
            from { background-position: 0 0, 0 0; }
            to { background-position: 40px 80px, 120px 240px; }
        }

        /* Responsive Mobile Layout Grid Updates */
        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; letter-spacing: 4px; }
            main { padding: 20px; margin: 15px; }
            .canvas-frame { height: 300px; }
        }
    </style>
</head>
<body>

    <div class="cosmic-void"></div>

    <header>
        <div class="divine-halo"></div>
        <h1>Celestial Legion</h1>
        <div class="subtitle">Angelic Architypes Secure XRPL Identity</div>
    </header>

    <main>
        <h2>Sovereign Manifestation</h2>
        <div class="meta-tag">Decentralized IPFS Data Verified</div>
        
        <div class="canvas-frame">
            <!-- Direct Decentralized IPFS Art Stream -->
            <img class="angel-image" src="https://filebase.io" alt="Celestial Legion Legendary Artwork">
        </div>

        
        <a href="https://bithomp.com" target="_blank" class="sovereign-btn">Verify Architecture via Bithomp</a>
    </main>

</body>
</html>
